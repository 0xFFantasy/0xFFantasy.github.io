<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主机配置 - 0xFFantasy</title>
    <style>
        /* === 实测数据上传器样式 === */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #1f1f1f;
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 0 30px rgba(0, 191, 255, 0.3);
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid #333;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }

        .close {
            color: #aaa;
            font-size: 1.5em;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .close:hover { color: #00bfff; }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            color: #aaa;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid #555;
            color: #fff;
            border-radius: 8px;
            font-size: 1em;
        }

        .form-group select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%23aaa' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6,9 12,15 18,9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 16px;
        }

        @media (max-width: 480px) {
            .modal-content { width: 95%; padding: 20px; }
        }

        :root { --primary: #00bfff; }
        body { 
            font-family: "Microsoft YaHei", system-ui, sans-serif; 
            margin: 0; padding: 20px; 
            background: #0f0f0f; color: #fff; 
        }
        h1 { text-align: center; margin: 30px 0 10px; font-size: 2.5em; }
        .subtitle { text-align: center; color: #aaa; margin-bottom: 30px; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto 20px;
        }
        .back-btn {
            padding: 10px 20px;
            background: #1f1f1f;
            color: #fff;
            border: 2px solid var(--primary);
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.1em;
        }

        .preset-container {
            max-width: 1400px;
            margin: 0 auto 40px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .preset-btn {
            padding: 16px 40px;
            font-size: 1.25em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 180px;
        }
        .preset-btn.gaming { background: #4ade80; color: #000; }
        .preset-btn.productivity { background: #fb923c; color: #000; }
        .preset-btn.balanced { background: #00bfff; color: #000; }
        .preset-btn:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(0, 191, 255, 0.5); }

        /* ==================== 新三栏布局 ==================== */
        .config-container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 380px 1fr 380px;   /* 左侧CPU/GPU | 中间配置 | 右侧上传 */
            gap: 25px;
            align-items: start;
        }

        .left-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .selection-panel {
            background: #1f1f1f;
            border-radius: 16px;
            padding: 18px;
        }
        .panel-title {
            font-size: 1.35em;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .search-box {
            width: 100%;
            padding: 13px 18px;
            font-size: 1.05em;
            background: #2a2a2a;
            border: 2px solid #00bfff;
            border-radius: 50px;
            color: #fff;
            margin-bottom: 15px;
            outline: none;
        }
        .hardware-list {
            max-height: 235px;       /* 缩短列表，让CPU+GPU一屏可见 */
            overflow-y: auto;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 6px;
        }
        .hardware-item {
            padding: 11px 15px;
            margin: 4px 0;
            background: #2a2a2a;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .hardware-item:hover {
            background: #3a3a3a;
        }
        .hardware-item.selected {
            background: var(--primary);
            color: #000;
            font-weight: bold;
        }

        /* 中间：配置预览（更高） */
        .preview-panel {
            background: #1f1f1f;
            border-radius: 16px;
            padding: 25px;
            position: sticky;
            top: 20px;
            height: fit-content;
        }
        .preview-title { 
            font-size: 1.5em; 
            margin-bottom: 20px; 
            text-align: center; 
        }
        .build-item {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .label { font-size: 0.9em; color: #aaa; }
        .value { font-size: 1.3em; font-weight: bold; margin-top: 4px; }

        .action-btn {
            width: 100%;
            padding: 16px;
            margin-top: 20px;
            font-size: 1.2em;
            font-weight: bold;
            background: #00bfff;
            color: #000;
            border: none;
            border-radius: 50px;
            cursor: pointer;
        }

        /* 右侧：上传数据区域 */
        .upload-area {
            background: #1f1f1f;
            border-radius: 16px;
            padding: 25px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .footer {
            text-align: center;
            margin-top: 60px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="back-btn" onclick="goBack()">← 返回天梯图</button>
        <h1 style="margin: 0; flex: 1; text-align: center;">🛠️ 主机配置助手 2026</h1>
        <div></div>
    </div>
    <p class="subtitle">基于天梯图为你推荐最强CPU + GPU组合</p>

    <!-- 自动配置预设 -->
    <div class="preset-container">
        <button class="preset-btn gaming" onclick="loadPreset('gaming')">🎮 游戏主导</button>
        <button class="preset-btn productivity" onclick="loadPreset('productivity')">💼 办公主导</button>
        <button class="preset-btn balanced" onclick="loadPreset('balanced')">⚖️ 综合主导</button>
    </div>

    <div class="config-container">
        <!-- 左侧：CPU + GPU 垂直排列 -->
        <div class="left-column">
            <!-- CPU 选择 -->
            <div class="selection-panel">
                <div class="panel-title">
                    <span>🧠</span>
                    <span>CPU 选择</span>
                </div>
                <input type="text" id="cpuSearch" class="search-box" placeholder="搜索CPU型号（如 9850X3D、14900K）..." onkeyup="filterCPU()">
                <div id="cpuList" class="hardware-list"></div>
            </div>

            <!-- GPU 选择 -->
            <div class="selection-panel">
                <div class="panel-title">
                    <span>🎮</span>
                    <span>GPU 选择</span>
                </div>
                <input type="text" id="gpuSearch" class="search-box" placeholder="搜索显卡型号（如 RTX 5090、RX 7900XTX）..." onkeyup="filterGPU()">
                <div id="gpuList" class="hardware-list"></div>
            </div>
        </div>

        <!-- 中间：你的配置预览 -->
        <div class="preview-panel">
            <div class="preview-title">📋 你的配置</div>
            
            <div class="build-item">
                <div class="label">CPU</div>
                <div id="selectedCPU" class="value">未选择</div>
            </div>
            
            <div class="build-item">
                <div class="label">GPU</div>
                <div id="selectedGPU" class="value">未选择</div>
            </div>

            <div style="margin-top: 25px; font-size: 0.95em; color: #0f0; line-height: 1.5;">
                💡 提示：点击左侧列表选择硬件<br>或使用上方预设按钮快速生成推荐配置
            </div>

            <button class="action-btn" onclick="saveConfig()">💾 保存此配置</button>
            <button class="action-btn" style="background:#fb923c; margin-top:10px;" onclick="resetConfig()">🔄 重置配置</button>
        </div>

        <!-- 右侧：上传实测数据 -->
        <div class="upload-area">
            <div style="font-size: 1.1em; color: #00bfff; margin-bottom: 15px; text-align: center;">📊 分享你的实测</div>
            <button onclick="document.getElementById('dataModal').style.display='flex'" 
                    style="width: 100%; padding: 18px; background: #00bfff; color: #000; border: none; border-radius: 12px; font-weight: bold; font-size: 1.1em; cursor: pointer;">
                📤 上传实测数据<br><span style="font-size:0.85em; opacity:0.9;">(含超频/内存)</span>
            </button>
            <div style="font-size: 0.85em; color: #666; margin-top: 12px; text-align: center;">
                您的数据将帮助更多人
            </div>
        </div>
    </div>

    <div class="footer">
        0xFFantasy 主机配置工具 | 持续更新中
    </div>

    <script>
        const cpus = [
            "R7 9850X3D", "R9 9950X3D", "R7 9800X3D", "R7 7800X3D", 
            "Ultra 9 285K", "Ultra 7 270K Plus", "i9-14900K", "i9-13900K",
            "R9 9950X", "R9 7950X3D", "R7 9700X", "R5 9600X3D",
            "i7-14700K", "i5-14600K", "R5 7600X", "R7 7700",
            "Threadripper 9980X", "Threadripper 7980X", "Threadripper 9970X",
            "i9-14900KS", "Ultra 7 265K", "R9 7900X", "i7-13700K"
        ];

        const gpus = [
            "RTX 5090", "RTX 4090", "RTX 5080", "RTX 4080Super", "RTX 4080",
            "RTX 5070Ti", "RTX 4070Ti Super", "RTX 4070Ti", "RTX 5070",
            "RX 7900XTX", "RX 9070XT", "RX 9070", "RX 7900XT", "RX 7900 GRE",
            "RTX 4070Super", "RX 7800XT", "RTX 5060Ti 16GB", "RX 7700XT",
            "RTX 4060Ti 16GB", "RX 6800XT", "Arc B580", "Arc A770"
        ];

        let selectedCPU = null;
        let selectedGPU = null;

        function renderCPUList(filtered) {
            const container = document.getElementById('cpuList');
            container.innerHTML = '';
            filtered.forEach(cpu => {
                const div = document.createElement('div');
                div.className = `hardware-item ${selectedCPU === cpu ? 'selected' : ''}`;
                div.textContent = cpu;
                div.onclick = () => selectCPU(cpu);
                container.appendChild(div);
            });
            if (filtered.length === 0) container.innerHTML = '<div style="padding:20px;text-align:center;color:#666;">没有找到匹配的CPU</div>';
        }

        function renderGPUList(filtered) {
            const container = document.getElementById('gpuList');
            container.innerHTML = '';
            filtered.forEach(gpu => {
                const div = document.createElement('div');
                div.className = `hardware-item ${selectedGPU === gpu ? 'selected' : ''}`;
                div.textContent = gpu;
                div.onclick = () => selectGPU(gpu);
                container.appendChild(div);
            });
            if (filtered.length === 0) container.innerHTML = '<div style="padding:20px;text-align:center;color:#666;">没有找到匹配的显卡</div>';
        }

        function filterCPU() {
            const query = document.getElementById('cpuSearch').value.toUpperCase();
            const filtered = cpus.filter(cpu => cpu.toUpperCase().includes(query));
            renderCPUList(filtered);
        }

        function filterGPU() {
            const query = document.getElementById('gpuSearch').value.toUpperCase();
            const filtered = gpus.filter(gpu => gpu.toUpperCase().includes(query));
            renderGPUList(filtered);
        }

        function selectCPU(cpu) {
            selectedCPU = cpu;
            document.getElementById('selectedCPU').textContent = cpu;
            renderCPUList(cpus);
        }

        function selectGPU(gpu) {
            selectedGPU = gpu;
            document.getElementById('selectedGPU').textContent = gpu;
            renderGPUList(gpus);
        }

        function loadPreset(type) {
            if (type === 'gaming') {
                selectedCPU = "R7 9850X3D";
                selectedGPU = "RTX 5090";
            } else if (type === 'productivity') {
                selectedCPU = "Threadripper 9980X";
                selectedGPU = "RTX 5090";
            } else if (type === 'balanced') {
                selectedCPU = "R7 7800X3D";
                selectedGPU = "RTX 5080";
            }
            document.getElementById('selectedCPU').textContent = selectedCPU;
            document.getElementById('selectedGPU').textContent = selectedGPU;
            renderCPUList(cpus);
            renderGPUList(gpus);
        }

        function resetConfig() {
            selectedCPU = selectedGPU = null;
            document.getElementById('selectedCPU').textContent = "未选择";
            document.getElementById('selectedGPU').textContent = "未选择";
            document.getElementById('cpuSearch').value = '';
            document.getElementById('gpuSearch').value = '';
            renderCPUList(cpus);
            renderGPUList(gpus);
        }

        function saveConfig() {
            if (!selectedCPU || !selectedGPU) {
                alert("请至少选择一个CPU和GPU！");
                return;
            }
            const config = { cpu: selectedCPU, gpu: selectedGPU, time: new Date().toLocaleString('zh-CN') };
            let history = JSON.parse(localStorage.getItem('pcConfigs') || '[]');
            history.unshift(config);
            localStorage.setItem('pcConfigs', JSON.stringify(history.slice(0, 5)));
            alert(`✅ 配置已保存！\n\nCPU: ${selectedCPU}\nGPU: ${selectedGPU}\n\n历史记录已保存，可下次打开配置页查看。`);
        }

        function goBack() {
            window.opener ? window.close() : (window.location.href = 'index.html');
        }

        window.onload = () => {
            renderCPUList(cpus);
            renderGPUList(gpus);
        };
    </script>

    <!-- === 实测数据上传弹窗 (Modal) === -->
    <div id="dataModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="color: #00bfff; margin: 0;">📈 上传你的实测数据</h3>
                <span class="close" onclick="document.getElementById('dataModal').style.display='none'">&times;</span>
            </div>
            
            <form id="benchmarkForm">
                <input type="hidden" id="formCpu" name="cpu">
                <input type="hidden" id="formGpu" name="gpu">

                <div class="form-group">
                    <label>🎮 游戏/场景名称</label>
                    <input type="text" id="gameName" placeholder="例如: 黑神话：悟空, Cyberpunk 2077" required>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label>🎨 画质预设</label>
                        <select id="presetQuality" required>
                            <option value="">请选择</option>
                            <option value="低 (Low)">低 (Low)</option>
                            <option value="中 (Medium)">中 (Medium)</option>
                            <option value="高 (High)">高 (High)</option>
                            <option value="最高 (Ultra)">最高 (Ultra)</option>
                            <option value="极高 (Extreme)">极高 (Extreme)</option>
                            <option value="电影级 (Cinematic)">电影级 (Cinematic)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>📊 分辨率</label>
                        <select id="resolution" required>
                            <option value="">请选择</option>
                            <option value="1080p (1920x1080)">1080p</option>
                            <option value="2K (2560x1440)">2K</option>
                            <option value="4K (3840x2160)">4K</option>
                        </select>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label>📈 平均帧数 (FPS)</label>
                        <input type="number" id="avgFps" placeholder="例如: 144" required>
                    </div>
                    <div class="form-group">
                        <label>📉 最低帧 (Low 1%) </label>
                        <input type="number" id="lowFps" placeholder="例如: 60">
                    </div>
                </div>

                <details style="margin-top: 20px; background: #2a2a2a; padding: 15px; border-radius: 8px;">
                    <summary style="color: #00bfff; cursor: pointer; font-weight: bold;">⚙️ 硬件进阶参数 (点击展开填写)</summary>
                    <div style="margin-top: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <div style="grid-column: span 2;">
                            <label>🧠 CPU 状态</label>
                            <select id="cpuTuning" style="width: 100%;">
                                <option value="默频">默频 (Stock)</option>
                                <option value="PBO Auto">AMD PBO Auto</option>
                                <option value="PBO 手动">AMD PBO 手动</option>
                                <option value="AMD定频定压">AMD定频定压</option>
                                <option value="Intel 超频">Intel 超频 (OC)</option>
                            </select>
                            <input type="text" id="pboNote" style="width: 100%; margin-top: 5px; font-size: 0.9em;" 
                                   placeholder="选填: 例如 PBO+200 全核负压30/分核负压, 或 全核/大小核定频">
                        </div>
                        <div>
                            <label>💾 内存频率 (MHz)</label>
                            <input type="number" id="ramFreq" placeholder="例如: 6400">
                        </div>
                        <div style="grid-column: span 2;">
                            <label>⏱️ 内存时序 (CL)</label>
                            <input type="text" id="ramTiming" placeholder="例如: 32-39-39-102">
                        </div>
                        <div style="grid-column: span 2;width: 100%; margin-top: 5px;"">
    <label>💽 系统/游戏硬盘 (选填)</label>
    <input type="text" id="ssdModel" 
           placeholder="例如: 三星990 Pro/ 西数 SN850, 或 机械硬盘"style="width: 100%; box-sizing: border-box; font-size: 1em;">
</div>
                    </div>
                </details>

                <button type="submit" style="width: 100%; padding: 15px; margin-top: 20px; background: #00bfff; color: #000; border: none; border-radius: 8px; font-size: 1.1em; font-weight: bold; cursor: pointer;">
                    🚀 生成 Issue 并上传
                </button>
            </form>
        </div>
    </div>

    <script>
        // 上传弹窗逻辑
        document.getElementById('benchmarkForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const cpu = document.getElementById('selectedCPU').textContent;
            const gpu = document.getElementById('selectedGPU').textContent;
            if (cpu === '未选择' || gpu === '未选择') {
                alert('请先在上方选择 CPU 和 GPU！');
                return;
            }

            const game = document.getElementById('gameName').value;
            const avgFps = document.getElementById('avgFps').value;
            const lowFps = document.getElementById('lowFps').value || '未知';
            const resolution = document.getElementById('resolution').value;
            const presetQuality = document.getElementById('presetQuality').value;

            const cpuTuning = document.getElementById('cpuTuning').value;
            const pboNote = document.getElementById('pboNote').value;
            const ramFreq = document.getElementById('ramFreq').value || '默认';
            const ramTiming = document.getElementById('ramTiming').value || '默认';
            const ssdModel = document.getElementById('ssdModel').value || '未填写'; // 新增：硬盘型号

            let finalCpuTuning = cpuTuning;
            if (pboNote.trim() !== '') {
                finalCpuTuning = `${cpuTuning} (备注: ${pboNote})`;
            }

            const repoOwner = "0xFFantasy"; 
            const repoName = "0xFFantasy.github.io"; 
            
            const title = encodeURIComponent(`🎮 ${game} 实测: ${cpu} @ ${presetQuality}`);
            const body = encodeURIComponent(`
### 📊 实测数据详情

| 项目 | 信息 |
| :--- | :--- |
| **游戏** | ${game} |
| **画质** | ${presetQuality} |
| **分辨率** | ${resolution} |
| **平均帧** | ${avgFps} FPS |
| **1% Low** | ${lowFps} FPS |
| **配置** | ${cpu} + ${gpu} |

---

### ⚙️ 硬件调校细节
\`\`\`
硬盘型号: ${ssdModel}
CPU 状态: ${finalCpuTuning}
内存频率: ${ramFreq} MHz
内存时序: ${ramTiming}
\`\`\`
> **来源**: 0xFFantasy 2026 配置器
`);

            const url = `https://github.com/${repoOwner}/${repoName}/issues/new?title=${title}&body=${body}`;
            window.open(url, '_blank');
            document.getElementById('dataModal').style.display = 'none';
        });
    </script>
    <!-- ==================== DeepSeek AI 智能推荐区域 ==================== -->
<div style="margin: 40px 0; padding: 25px; background: rgba(0,0,0,0.4); border-radius: 16px; border: 1px solid #00ff9d;">
    <h3 style="margin-bottom: 15px; color: #00ff9d;">🤖 DeepSeek AI 智能配置推荐</h3>
    
    <div style="margin-bottom: 15px;">
        <label>预算（元）：</label>
        <input type="number" id="budget" value="8000" style="width:120px; padding:8px; margin-left:10px;">
    </div>
    
    <div style="margin-bottom: 20px;">
        <label>主要用途：</label>
        <select id="usage" style="padding:8px; margin-left:10px;">
            <option value="1080p 高帧率网游">1080p 高帧率网游</option>
            <option value="1440p 高画质游戏">1440p 高画质游戏</option>
            <option value="4K 游戏">4K 游戏</option>
            <option value="视频剪辑 / 3D渲染">视频剪辑 / 3D渲染</option>
            <option value="AI 训练 / 大模型本地部署">AI 训练 / 大模型本地部署</option>
            <option value="日常办公 + 轻度游戏">日常办公 + 轻度游戏</option>
        </select>
    </div>

    <button onclick="getDeepSeekRecommendation()" 
            style="padding:12px 28px; font-size:16px; background:#00ff9d; color:black; border:none; border-radius:8px; cursor:pointer;">
        🚀 获取 AI 推荐配置
    </button>

    <div id="aiResult" style="margin-top:25px; line-height:1.7; min-height:100px;"></div>
</div>

<script>
// ==================== DeepSeek 配置 ====================
const DEEPSEEK_API_KEY = "";   // ←←← 这里改成你的真实 API Key

async function getDeepSeekRecommendation() {
    const budget = document.getElementById('budget').value || "8000";
    const usage = document.getElementById('usage').value;

    // 把你的硬件数据完整喂给 AI
    const cpuList = hardwareData.cpus.map(c => `${c.name} (游戏性能:${c.gameScore} 综合:${c.compScore})`).join("、");
    const gpuList = hardwareData.gpus.map(g => `${g.name} (游戏性能:${g.gameScore} 综合:${g.compScore})`).join("、");

    const prompt = `你是一位极专业的电脑硬件配置师。

用户预算大约 ${budget} 元，主要用途是：${usage}。

请严格基于以下硬件数据库进行推荐：

CPU 列表：${cpuList}
GPU 列表：${gpuList}

请直接输出以下格式，不要添加多余内容：
推荐配置：
CPU：xxx
GPU：xxx
总价预估：xxxx 元左右
推荐理由：（简短有力，说明性能平衡和性价比）
潜在瓶颈及升级建议：xxx`;

    const resultDiv = document.getElementById('aiResult');
    resultDiv.innerHTML = "<strong>DeepSeek 正在深度思考中...</strong> ⏳";

    try {
        const response = await fetch("https://api.deepseek.com/chat/completions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${DEEPSEEK_API_KEY}`
            },
            body: JSON.stringify({
                model: "deepseek-chat",        // 推荐使用这个模型
                messages: [{ role: "user", content: prompt }],
                temperature: 0.65,
                max_tokens: 900
            })
        });

        const data = await response.json();
        let answer = data.choices[0].message.content;

        resultDiv.innerHTML = `<strong>DeepSeek 推荐：</strong><br><br>${answer.replace(/\n/g, '<br>')}`;
    } catch (error) {
        resultDiv.innerHTML = "❌ 调用失败，请检查 API Key 是否正确，或稍后重试。";
        console.error(error);
    }
}
</script>
</body>
</html>
